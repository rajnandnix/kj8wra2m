# One command: docker compose up --build   then open http://localhost:3000
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: "http://localhost:3000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:8080"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
